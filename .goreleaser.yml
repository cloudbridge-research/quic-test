# Cloudbridge Research QUIC testing - GoReleaser конфигурация
# Автоматическая сборка релизов для всех платформ

project_name: quic-test
before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  # Основной бинарник
  - id: quic-test
    binary: quic-test
    main: .
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo
      - osusergo

  # Dashboard
  - id: dashboard
    binary: dashboard
    main: ./cmd/dashboard
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo
      - osusergo

  # QUIC Client
  - id: quic-client
    binary: quic-client
    main: ./cmd/quic-client
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo
      - osusergo

  # QUIC Server
  - id: quic-server
    binary: quic-server
    main: ./cmd/quic-server
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo
      - osusergo

  # TUI Dashboard
  - id: tui
    binary: tui
    main: ./cmd/tui
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    tags:
      - netgo
      - osusergo

archives:
  - id: quic-test
    name_template: "quic-test_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
    builds:
      - quic-test

  - id: dashboard
    name_template: "dashboard_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
    builds:
      - dashboard

  - id: quic-client
    name_template: "quic-client_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
    builds:
      - quic-client

  - id: quic-server
    name_template: "quic-server_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
    builds:
      - quic-server

  - id: tui
    name_template: "tui_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
    builds:
      - tui

  # Полный пакет со всеми компонентами
  - id: full
    name_template: "quic-test-full_{{.Os}}_{{.Arch}}_v{{.Version}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - readme.md
      - LICENSE
      - Makefile
      - docker-compose.yml
      - Dockerfile*
    builds:
      - quic-test
      - dashboard
      - quic-client
      - quic-server
      - tui

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

release:
  github:
    owner: twogc
    name: quic-test
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## Cloudbridge Research QUIC testing v{{.Version}}
    
    ### 📦 Что включено:
    - **quic-test**: Основной бинарник для тестирования
    - **dashboard**: Веб-интерфейс для мониторинга
    - **tui**: TUI дашборд для терминала
    - **quic-client**: QUIC клиент
    - **quic-server**: QUIC сервер
    
    ### Поддерживаемые платформы:
    - Linux (amd64, arm64)
    - macOS (amd64, arm64)
    - Windows (amd64, arm64)
    
    ### Чек-лист релиза:
    - [ ] Все бинарники собраны для всех платформ
    - [ ] Тесты пройдены успешно
    - [ ] Документация обновлена
    - [ ] Docker образы собраны
    - [ ] Безопасность проверена (gosec)
    - [ ] Производительность протестирована
    - [ ] Совместимость с Go {{.GoVersion}} подтверждена

  footer: |
    ## 📖 Использование
    
    ### Быстрый старт:
    ```bash
    # Скачать и распаковать
    tar -xzf quic-test-full_linux_amd64_v{{.Version}}.tar.gz
    cd quic-test-full_linux_amd64_v{{.Version}}
    
    # Запуск сервера
    ./quic-server --addr=:9000 --prometheus
    
    # Запуск клиента
    ./quic-client --addr=127.0.0.1:9000 --connections=2 --streams=4
    
    # Запуск дашборда
    ./dashboard --addr=:9990
    
    # Запуск TUI дашборда
    ./tui --demo --fps 10
    ```
    
    ### Docker:
    ```bash
    docker-compose up --build
    ```
    
    ## 🔧 Требования
    - Go 1.21+ (для сборки из исходников)
    - Docker (для контейнерного развертывания)
    - 2GB RAM (рекомендуется)
    
    ## Мониторинг
    - Prometheus метрики: `:2112/metrics` (клиент), `:2113/metrics` (сервер)
    - Веб-дашборд: `:9990`
    - pprof профилирование: `:6060/debug/pprof`

dockers:
  - image_templates:
      - "quic-test:{{ .Version }}"
      - "quic-test:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Cloudbridge Research QUIC testing"
      - "--label=org.opencontainers.image.description=QUIC performance testing tool"
      - "--label=org.opencontainers.image.url=https://github.com/twogc/quic-test"
      - "--label=org.opencontainers.image.source=https://github.com/twogc/quic-test"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

  - image_templates:
      - "quic-test-dashboard:{{ .Version }}"
      - "quic-test-dashboard:latest"
    dockerfile: Dockerfile.dashboard
    build_flag_templates:
      - "--label=org.opencontainers.image.title=Cloudbridge Research Dashboard"
      - "--label=org.opencontainers.image.description=QUIC testing dashboard"
      - "--label=org.opencontainers.image.url=https://github.com/twogc/quic-test"
      - "--label=org.opencontainers.image.source=https://github.com/twogc/quic-test"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

announce:
  skip: false
  twitter:
    enabled: false
  mastodon:
    enabled: false
  reddit:
    enabled: false
  linkedin:
    enabled: false
  slack:
    enabled: false
  discord:
    enabled: false
  teams:
    enabled: false
  telegram:
    enabled: false
  smtp:
    enabled: false
